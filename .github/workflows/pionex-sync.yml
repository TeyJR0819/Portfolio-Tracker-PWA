name: Pionex sync
on:
  schedule:
    # GitHub runs schedules on a best-effort basis and often starts them late or skips some. A run every 15 minutes
    # (not on the busy :00 mark) means a late or skipped run still leaves Pionex read within the hour.
    # Runs never overlap (see concurrency).
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pionex-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/pionex-sync.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
