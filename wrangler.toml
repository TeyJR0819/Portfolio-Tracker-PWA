# Cloudflare settings for "npx wrangler deploy".
# The name must match the Worker name shown in the Cloudflare dashboard.
name = "portfolio-tracker-pwa"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Keeps the Worker logs in the Cloudflare dashboard (Observability) so a failed sync can be read.
[observability]
enabled = true

# Reads broker balances every 15 minutes (see src/brokers/sync.js).
[triggers]
crons = ["*/15 * * * *"]
