# Cloudflare settings for "npx wrangler deploy".
# The name must match the Worker name shown in the Cloudflare dashboard.
name = "portfolio-tracker-pwa"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Keeps the Worker logs in the Cloudflare dashboard (Observability) so a failed sync can be read.
[observability]
enabled = true

# Every 15 minutes the brokers are read (src/brokers/sync.js). Seven minutes later the ledger is
# updated from what was read (src/ledger-sync.js). Keep the second schedule equal to LEDGER_CRON in src/worker.js.
[triggers]
crons = ["*/15 * * * *", "7-59/15 * * * *"]
